repository: https://github.com/bitpoints-cashu/bitpoints.me
license: MIT
icon: icon.png
summary: A Cashu Ecash Wallet with Bluetooth Mesh Networking, Nostr Integration, and PWA Support
description: |
  Bitpoints.me is a privacy-focused Cashu ecash wallet that enables offline peer-to-peer payments through Bluetooth mesh networking. Features include Lightning Network integration, Nostr identity management, and cross-platform compatibility.

  Recent Update (v1.4.6): Complete Safari compatibility fixes - QR scanner now works in Safari, improved settings layout with backup sections moved to bottom, enhanced clipboard paste functionality, and LNURL withdrawal double-click prevention.

  Key Features:
  - Bluetooth mesh peer-to-peer ecash transfers
  - Lightning Network integration via Cashu protocol
  - Nostr identity and messaging
  - Offline payment capabilities
  - Cross-platform (Android, iOS, PWA)
  - Privacy-focused design
tags: bitcoin cashu nostr bluetooth mesh privacy ecash wallet offline payments pwa progressive-web-app lightning
assets:
  - bitpoints-v\d+\.\d+\.\d+-.*\.apk
remote_metadata:
  - github
